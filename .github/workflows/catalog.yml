name: Update Jellyfin plugin catalog

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jellyfin-plugin-catalog
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ruols/jellyfin-provider-id-lookup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify published packages and update the catalog
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/sync_catalog.py &&
              python3 -c 'import json, os; tag = os.environ["RELEASE_TAG"]; assert not tag or any(v["version"] == tag[1:] for v in json.load(open("manifest.json"))[0]["versions"]), f"{tag} is not available in the catalog yet"'; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Publish the verified catalog
        shell: bash
        run: |
          if git diff --quiet -- manifest.json; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git diff --check -- manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- manifest.json
          git commit -m '更新 Jellyfin 插件源版本清单'
          git push origin HEAD:main
